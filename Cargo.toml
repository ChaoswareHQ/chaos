[workspace]
resolver = "3"
default-members = ["apps/client"]
members = ["apps/*", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChaoswareHQ/chaos"
readme = "README.md"
rust-version = "1.98.0"
version = "0.1.0"

[workspace.dependencies]
crossbeam-channel = "0.5.17"
mimalloc = "0.1.52"
windows = "0.62.2"
zerocopy = { version = "0.8.57", features = ["derive"] }
thiserror = "2.0.20"

chrono = "0.4.45"
uuid = "1.26.1"
serde = "1.0.229"
serde_json = "1.0.151"
