[workspace]
resolver = "3"
default-members = ["apps/*"]
members = [
    "apps/*",
    "crates/adapters/mac/*",
    "crates/adapters/linux/*",
    "crates/adapters/windows/*",
    "crates/adapters/respond",
    "crates/asmr",
    "crates/config",
    "crates/model",
    "crates/pipeline",
    "crates/ports",
    "crates/protocol",
    "crates/sigma",
    "crates/supervision",
    "crates/transport", "crates/observer",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChaoswareHQ/chaos"
readme = "README.md"
rust-version = "1.98.0"
version = "0.1.0"

[workspace.dependencies]
asmr = { path = "crates/asmr" }
config = { path = "crates/config" }
ebpf = { path = "crates/adapters/linux/ebpf" }
es = { path = "crates/adapters/mac/es" }
etw = { path = "crates/adapters/windows/etw" }
model = { path = "crates/model" }
observer = { path = "crates/observer" }
pipeline = { path = "crates/pipeline" }
ports = { path = "crates/ports" }
protocol = { path = "crates/protocol" }
respond = { path = "crates/adapters/respond" }
sigma = { path = "crates/sigma" }
supervision = { path = "crates/supervision" }
transport = { path = "crates/transport" }

# TLS is the platform's own: SChannel on Windows, Security.framework on macOS,
# OpenSSL on Linux. The agent runs on every endpoint in the estate, and a
# security product that bundles its own TLS stack has bundled itself a second
# thing to patch on all of them. It also means the trust store is the machine's
# rather than a copy that has to be refreshed.
native-tls = "0.2.14"

crossbeam-channel = "0.5.17"
# Wire-body compression. Pure Rust (miniz_oxide), no C toolchain, and the same
# crate on both sides of the protocol so the framing cannot drift.
flate2 = "1"
goblin = { version = "0.10.7", default-features = false, features = [
    "std",
    "alloc",
    "elf32",
    "elf64",
    "pe32",
    "pe64",
] }
mimalloc = "0.1.52"
windows = "0.62.2"

axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

indexmap = { version = "2.14.2", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
thiserror = "2.0.20"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
