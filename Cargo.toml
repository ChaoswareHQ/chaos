[workspace]
resolver = "3"
default-members = ["apps/client"]
members = [
    "apps/*",
    "crates/adapters/*",
    "crates/asmr",
    "crates/config",
    "crates/model",
    "crates/pipeline",
    "crates/ports",
    "tools/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChaoswareHQ/chaos"
readme = "README.md"
rust-version = "1.98.0"
version = "0.1.0"

[workspace.dependencies]
# --- infrastructure -------------------------------------------------------
asmr = { path = "crates/asmr" }
config = { path = "crates/config" }
ebpf = { path = "crates/adapters/ebpf" }
es = { path = "crates/adapters/es" }
etw = { path = "crates/adapters/etw" }
model = { path = "crates/model" }
pipeline = { path = "crates/pipeline" }
ports = { path = "crates/ports" }

# --- third party ----------------------------------------------------------
crossbeam-channel = "0.5.17"
mimalloc = "0.1.52"
windows = "0.62.2"

indexmap = { version = "2.14.2", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
toml = "1.1.6"
thiserror = "2.0.20"
