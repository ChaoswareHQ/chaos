[workspace]
resolver = "3"
default-members = ["apps/*"]
members = [
    "apps/*",
    "crates/adapters/mac/*",
    "crates/adapters/linux/*",
    "crates/adapters/windows/*",
    "crates/adapters/respond",
    "crates/asmr",
    "crates/config",
    "crates/model",
    "crates/pipeline",
    "crates/ports",
    "crates/protocol",
    "crates/supervision",
    "crates/transport", "crates/observer",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChaoswareHQ/chaos"
readme = "README.md"
rust-version = "1.98.0"
version = "0.1.0"

[workspace.dependencies]
asmr = { path = "crates/asmr" }
config = { path = "crates/config" }
ebpf = { path = "crates/adapters/linux/ebpf" }
es = { path = "crates/adapters/mac/es" }
etw = { path = "crates/adapters/windows/etw" }
model = { path = "crates/model" }
pipeline = { path = "crates/pipeline" }
ports = { path = "crates/ports" }
protocol = { path = "crates/protocol" }
respond = { path = "crates/adapters/respond" }
transport = { path = "crates/transport" }

crossbeam-channel = "0.5.17"
goblin = { version = "0.10.7", default-features = false, features = [
    "std",
    "alloc",
    "elf32",
    "elf64",
    "pe32",
    "pe64",
] }
mimalloc = "0.1.52"
windows = "0.62.2"

axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

indexmap = { version = "2.14.2", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
toml = "1.1.6"
thiserror = "2.0.20"
